exclude: ^syntaxes/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx --no-install eslint
        language: system
        types: [ts]
      - id: tsc
        name: tsc (strict typecheck)
        entry: npx --no-install tsc --noEmit -p .
        language: system
        types: [ts]
        pass_filenames: false
